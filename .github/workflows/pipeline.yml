name: Pipeline de extracción diaria

# Flujo ETL claro en 5 etapas:
# 1) Extract: OpenSky flights (CRITICAL) + Open-Meteo weather + colectores
#    sin API key (METAR, festivos, EUROCONTROL PRU, OurAirports, NOTAM) → Bronze
#    Delta. OpenSky es crítico; el resto usa continue-on-error (aislamiento de fallos).
# 2) Bronze → Silver: promote Bronze data a MongoDB
# 3) Silver → Gold (flights): agrega vuelos en tablas analíticas
# 4) Entity sync: copia entidades raw (flights, aircraft, weather) a Gold
# 5) Feature store: construye la tabla gold.feature_store

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC (08:30 CEST)
    - cron: '30 19 * * *'  # 19:30 UTC (21:30 CEST)
  workflow_dispatch:       # trigger manual para testing
    inputs:
      metar_days:
        description: "METAR lookback window in days (collect_metar --days)"
        required: false
        default: "2"
      eurocontrol_year:
        description: "EUROCONTROL PRU year (empty = current year)"
        required: false
        default: ""

concurrency:
  group: pipeline-diaria
  cancel-in-progress: false

env:
  OPENSKY_DELTA_ROOT: s3://aeropredict-landing-zone

jobs:
  extract:
    name: "1/5 Extract → Bronze"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e .
      - uses: dopplerhq/cli-action@v3
      - name: Extraer OpenSky → Bronze Delta (R2)
        run: doppler run -- python scripts/extract_opensky_to_bronze.py --days 2
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Extraer Open-Meteo → Bronze Delta (R2)
        continue-on-error: true
        run: doppler run -- python scripts/collect_weather.py --days 2
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Collect METAR (NOAA AWC) → bronze/metar_awc
        continue-on-error: true
        run: doppler run -- python scripts/collect_metar.py --days "$METAR_DAYS"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          METAR_DAYS: ${{ github.event.inputs.metar_days || '2' }}
      - name: Collect Spanish holidays (Nager.Date + python-holidays) → bronze/holidays_*
        continue-on-error: true
        run: doppler run -- python scripts/collect_holidays.py
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Collect EUROCONTROL PRU CSV → bronze/eurocontrol_pru
        continue-on-error: true
        run: |
          if [ -n "$EUROCONTROL_YEAR" ]; then
            doppler run -- python scripts/collect_eurocontrol.py --year "$EUROCONTROL_YEAR"
          else
            doppler run -- python scripts/collect_eurocontrol.py
          fi
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EUROCONTROL_YEAR: ${{ github.event.inputs.eurocontrol_year || '' }}
      - name: Collect OurAirports (airports + runways) → bronze/ourairports_*
        continue-on-error: true
        run: doppler run -- python scripts/collect_ourairports.py
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Collect NOTAM (ENAIRE servAIS) → bronze/notam_enaire
        continue-on-error: true
        run: doppler run -- python scripts/collect_notam.py
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  bronze_to_silver:
    name: "2/5 Bronze → Silver"
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e .
      - uses: dopplerhq/cli-action@v3
      - name: Bronze Delta (R2) → MongoDB Atlas (flights + weather)
        run: doppler run -- python scripts/bronze_to_silver.py
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  silver_to_gold:
    name: "3/5 Silver → Gold (flights)"
    needs: bronze_to_silver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e .
      - uses: dopplerhq/cli-action@v3
      - name: MongoDB Atlas → Neon PostgreSQL (flights)
        run: doppler run -- python scripts/silver_to_gold.py
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  entities_to_gold:
    name: "4/5 Entity tables → Gold"
    needs: silver_to_gold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e .
      - uses: dopplerhq/cli-action@v3
      - name: Sync MongoDB entity tables (flights, aircraft, weather) → PostgreSQL
        run: doppler run -- python scripts/silver_to_gold_entities.py
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  build_feature_store:
    name: "5/5 Feature store"
    needs: entities_to_gold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e .
      - uses: dopplerhq/cli-action@v3
      - name: Build gold.feature_store
        run: doppler run -- python scripts/build_feature_store.py
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
