name: CI — Tests y lint

# Validación de código en push y pull requests a main.
# La pipeline de extracción (pipeline.yml) queda solo para el ETL de producción.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "1/2 Unit tests + coverage (≥70%)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev,ml,api]"
      - name: Ejecutar tests con cobertura
        run: pytest --cov=src/aeropredict --cov-report=term-missing tests/ --tb=short -q

  lint:
    name: "2/2 Ruff lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ scripts/ tests/
