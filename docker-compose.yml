services:
  mongodb:
    image: mongo:7
    container_name: aeropredict-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aeropredict
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: aeropredict-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aeropredict
      POSTGRES_USER: aeropredict
      POSTGRES_PASSWORD: aeropredict
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U aeropredict -d aeropredict
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aeropredict-api
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URI: postgresql://aeropredict:aeropredict@postgres:5432/aeropredict
      MONGODB_URI: mongodb://mongodb:27017/aeropredict
      AEROPREDICT_ENV: dev
      CORS_ORIGINS: http://localhost:5173,http://localhost:5173
    command: uvicorn aeropredict.api.server:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: aeropredict-web
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_USE_MOCK: "false"
      VITE_API_BASE_URL: "/api"
    command: npm run dev -- --host
    depends_on:
      - api

volumes:
  mongo_data:
  postgres_data:
